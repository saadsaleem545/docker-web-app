name: Docker CI/CD

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/saadsaleem545/docker-web-app:latest

  - name: Test deployed Docker image
    run: |
      docker pull ghcr.io/saadsaleem545/docker-web-app:latest
      docker run -d --name test-container -p 8080:80 ghcr.io/saadsaleem545/docker-web-app:latest
      sleep 5
      curl -f http://localhost:8080
      docker stop test-container
      docker rm test-container